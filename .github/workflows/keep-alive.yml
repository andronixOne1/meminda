name: Keep Render Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from spinning down after 15 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Meminda.ge Health Endpoint
        run: |
          curl -fsSL --max-time 30 -A "GitHub-Actions-KeepAlive" https://meminda.ge/api/health || true
